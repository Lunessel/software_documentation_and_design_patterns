{% extends "base.html" %}
{% block title %}Employees{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1>Employees</h1>
  <a href="/employees/new" class="btn btn-primary">
    <i class="bi bi-person-plus"></i> Add Employee
  </a>
</div>

<table class="table table-hover align-middle">
  <thead class="table-dark">
    <tr>
      <th>Name</th>
      <th>Position</th>
      <th class="text-center">Compensations</th>
      <th class="text-end">Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for row in rows %}
    <tr>
      <td><a href="/employees/{{ row.employee.employee_id }}">{{ row.employee.name }}</a></td>
      <td>{{ row.employee.position }}</td>
      <td class="text-center">
        <span class="badge bg-secondary">{{ row.comp_count }}</span>
      </td>
      <td class="text-end">
        <a href="/employees/{{ row.employee.employee_id }}" class="btn btn-sm btn-outline-primary">
          <i class="bi bi-eye"></i>
        </a>
        <a href="/employees/{{ row.employee.employee_id }}/edit" class="btn btn-sm btn-outline-warning">
          <i class="bi bi-pencil"></i>
        </a>
        <form method="post" action="/employees/{{ row.employee.employee_id }}/delete"
              class="d-inline" onsubmit="return confirm('Delete {{ row.employee.name }}?')">
          <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4" class="text-center text-muted">No employees yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
